<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Core SEO. Canonical host: change CANONICAL_ORIGIN if the domain changes. -->
    <title>Yehidat — Surprise Planning </title>
    <meta
      name="description"
      content="Yehidat plans surprise birthdays, anniversaries, graduations and more in Addis Ababa. Basic, Standard and Premium packages from 4,000 ETB. We handle every detail."
    />
    <link rel="canonical" href="https://yehidat.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#7a5a12" />

    <!-- Open Graph (link previews on WhatsApp, Telegram, Facebook, and AI search results) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yehidat" />
    <meta property="og:title" content="Yehidat — Surprise Planning in Addis Ababa" />
    <meta
      property="og:description"
      content="Surprise birthdays, anniversaries, graduations and more, planned for you in Addis Ababa."
    />
    <meta property="og:url" content="https://yehidat.vercel.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="am_ET" />
    <!-- og:image intentionally omitted until a 1200×630 px image exists in public/. -->

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yehidat — Surprise Planning in Addis Ababa" />
    <meta
      name="twitter:description"
      content="Surprise birthdays, anniversaries, graduations and more, planned for you in Addis Ababa."
    />

    <!-- Icons and manifest -->
    <link rel="icon" href="public/icons/assets_icon_navbar1.png" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="public/icons/assets_icon_navbar1.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="public/icons/assets_icon_navbar1.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data. Contact details match src/data/constants.js. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Yehidat",
        "url": "https://yehidat.vercel.app/",
        "description": "Surprise planning service in Addis Ababa for birthdays, anniversaries, graduations, and other occasions.",
        "telephone": "+251968034000",
        "email": "hawig74@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dukem/Bishoftu",
          "addressRegion": "Oromia",
          "addressCountry": "ET"
        },
        "areaServed": [
          { "@type": "City", "name": "Addis Ababa" },
          { "@type": "Country", "name": "Ethiopia" }
        ],
        "priceRange": "ETB 4,000 - ETB 10,000",
        "makesOffer": [
          { "@type": "Offer", "name": "Basic", "price": "4000", "priceCurrency": "ETB" },
          { "@type": "Offer", "name": "Standard", "price": "6000", "priceCurrency": "ETB" },
          { "@type": "Offer", "name": "Premium", "price": "10000", "priceCurrency": "ETB" }
        ]
      }
    </script>

  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
